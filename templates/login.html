<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#0a0a0b">
  <title>Forge — Login</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&display=swap" rel="stylesheet">
  <script>
    const saved = localStorage.getItem('forge-theme');
    if (saved) document.documentElement.setAttribute('data-theme', saved);
  </script>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <style>
    .login-container { display: flex; align-items: center; justify-content: center; min-height: 100dvh; padding: 20px; }
    .login-card { background: var(--surface-raised); border: 1px solid var(--border); border-radius: var(--radius); padding: 32px; max-width: 380px; width: 100%; text-align: center; }
    .login-title { font-size: 20px; font-weight: 600; color: var(--text-primary); margin-bottom: 8px; }
    .login-subtitle { font-size: 14px; color: var(--text-muted); margin-bottom: 24px; }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="login-card">
      <h1 class="login-title">Forge</h1>
      <p class="login-subtitle">You need an invite link to access this panel.</p>
      {% with messages = get_flashed_messages(with_categories=true) %}
        {% for category, message in messages %}
          <div class="flash flash-{{ category }}">{{ message }}</div>
        {% endfor %}
      {% endwith %}
      <p style="font-size: 13px; color: var(--text-muted);">Ask Tariq for an invite link, or connect via Tailscale for automatic access.</p>
    </div>
  </div>
</body>
</html>
