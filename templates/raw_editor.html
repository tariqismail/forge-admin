{% extends "layout.html" %}
{% set active_tab = "" %}
{% set page_title = "Edit " + filename %}

{% block content %}
<div class="page-header">
  <h1 class="page-title">{{ filename }}</h1>
  <p class="page-subtitle">Raw JSON editor. Be careful with changes here.</p>
</div>

<form method="POST" action="{{ url_for('raw_save', filename=filename) }}">
  <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">
  <textarea class="raw-editor" name="content" rows="30" spellcheck="false">{{ content }}</textarea>
  <div class="form-row" style="margin-top: 12px; justify-content: flex-end;">
    <a href="{{ url_for('home') }}" class="btn btn-secondary">Cancel</a>
    <button type="submit" class="btn btn-primary">Save</button>
  </div>
</form>
{% endblock %}
